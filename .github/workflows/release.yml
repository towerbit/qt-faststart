name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-c:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x64

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: qt-faststart-c

    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p ../release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            if [ -f "build/Release/qt-faststart.exe" ]; then
              cp build/Release/qt-faststart.exe ../release-assets/qt-faststart-c-${{ matrix.label }}.exe
            else
              cp build/qt-faststart.exe ../release-assets/qt-faststart-c-${{ matrix.label }}.exe
            fi
          else
            cp build/qt-faststart ../release-assets/qt-faststart-c-${{ matrix.label }}
          fi

      - name: Upload staged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-c-${{ matrix.label }}
          path: release-assets/*

  build-sharp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: qt-faststart-sharp.exe
          - os: ubuntu-latest
            rid: linux-x64
            artifact: qt-faststart-sharp
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: qt-faststart-sharp

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: qt-faststart-sharp

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT (${{ matrix.rid }})
        run: dotnet publish -r ${{ matrix.rid }} -c Release

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p ../release-assets
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.artifact }} ../release-assets/qt-faststart-sharp-${{ matrix.rid }}.exe
          else
            cp bin/Release/net10.0/${{ matrix.rid }}/publish/${{ matrix.artifact }} ../release-assets/qt-faststart-sharp-${{ matrix.rid }}
          fi

      - name: Upload staged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-sharp-${{ matrix.rid }}
          path: release-assets/*

  release:
    needs: [build-c, build-sharp]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-asset-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
